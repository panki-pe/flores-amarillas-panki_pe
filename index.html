<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores Amarillas 💛</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 🎵 MÚSICA -->
    <audio id="musica" loop>
        <source src="musica/cancion.mp3" type="audio/mpeg">
    </audio>


    <!-- 🌻 PANTALLA DE INICIO -->
    <section id="inicio">

        <div class="inicio-contenido">

            <div class="flor-inicio">🌻</div>

            <p class="fecha">
                21 DE SEPTIEMBRE
            </p>

            <h1>
                Tengo algo para ti...
            </h1>

            <p class="subtitulo">
                Alguien quiso hacer de este día
                algo un poquito más especial 💛
            </p>

            <button id="btnAbrir">
                Abrir mi regalo 🌻
            </button>

        </div>

    </section>


    <!-- 🌙 ESCENA PRINCIPAL -->
    <main id="escena">

        <!-- CIELO -->
        <div class="luna"></div>

        <div id="estrellas"></div>

        <div id="nubes"></div>

        <div id="luciernagas"></div>

        <div id="mariposas"></div>

        <div id="petalos"></div>


        <!-- 💌 CARTA -->
        <section id="carta">

            <div class="decoracion-carta">
                ✨ 🌼 🌻 🌼 ✨
            </div>

            <p class="para">
                Un pequeño detalle para
            </p>

            <h2 id="nombrePersona">
                Una persona especial 💛
            </h2>

            <div class="separador">
                🌻 ───── 💛 ───── 🌻
            </div>

            <div id="textoCarta"></div>

            <div id="firma"></div>

        </section>


        <!-- 🐶 PERRITO -->
        <div id="perrito">

            <div class="cola-perrito"></div>

            <div class="cuerpo-perrito">

                <div class="pata pata-1"></div>

                <div class="pata pata-2"></div>

            </div>

            <div class="cabeza-perrito">

                <div class="oreja oreja-1"></div>

                <div class="oreja oreja-2"></div>

                <div class="ojo ojo-1"></div>

                <div class="ojo ojo-2"></div>

                <div class="hocico"></div>

                <div class="nariz"></div>

                <div class="sonrisa"></div>

            </div>

            <div class="ramo-perrito">
                🌻🌼🌻
            </div>

            <div class="corazon-perrito">
                💛
            </div>

        </div>


        <!-- 🌻 JARDÍN -->
        <div id="jardin"></div>

        <div id="campoFlores"></div>

        <div class="pasto"></div>


        <!-- MENSAJE INFERIOR -->
        <div id="mensajeInferior">

            <span>🌻</span>

            Hecho especialmente para ti

            <span>🌻</span>

        </div>


        <!-- CONTROLES -->
        <button
            id="btnMusica"
            title="Activar o desactivar música">
            🔊
        </button>

        <button
            id="btnRepetir"
            title="Volver a ver">
            ↻
        </button>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
